name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Every harness sets Agg itself, but a headless runner should never be one
  # import away from trying to open a display.
  MPLBACKEND: Agg

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: fury_sim
        run: python -m pytest tests/ -q

  figures:
    name: figures reproduce from a clean checkout
    runs-on: ubuntu-latest
    # The README states results as fact. This job runs both studies from
    # scratch and publishes what they produce, so the figures in the docs are
    # checkable rather than taken on trust.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run both studies
        working-directory: fury_sim
        run: |
          python run_rcs_sweep.py
          python run_experiment.py

      - name: Upload regenerated figures and data
        uses: actions/upload-artifact@v4
        with:
          name: study-output
          path: fury_sim/output/
          if-no-files-found: error
